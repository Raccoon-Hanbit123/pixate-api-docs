window.ui=SwaggerUIBundle({spec:{"openapi": "3.0.3", "info": {"title": "Pix/ate API", "version": "2.5.0-mvp", "description": "Pix/ate — AI 상세페이지 로컬라이제이션 서비스 백엔드 API.\n\n범위: **MVP(2026-09-30 중간발표)** — Amazon Basic A+ 상세페이지 1종 · 한국어→미국·영어 ·\n내부 카테고리 7종 · **규제 분류 3축(국가·언어·규제분류)** · 단일 세션 S1→S8 전진 이동.\n\n기준 문서: 요구사항정의서 **v2.5**(2026-08-24) · 확정 ERD SQL · 파이프라인 데이터 계약(2026-08-24).\n각 오퍼레이션의 `x-feature-ids`는 커버리지 검수의 기능 ID 역참조다. must 84건 기준.\n\n### v1.8 → v2.5 반영 (핵심) - **규제 분류 축 신설(F-LNG-03)**: `GET /master/regulatory-classes` 추가. 규제 사전 조회 키 = (country, regulatory_class).\n  translate·compliance·delete-suggestions에 regulatory_class 전파. (regulatory_classes 테이블 · projects.regulatory_class_id)\n- **작업 취소(F-JOB-07)**: `POST /jobs/{id}/cancel` 추가. - **다운로드(F-LST-06) 12월 이월**: `/library/cards/{id}/download`는 `x-release: 2026-12`로 표기, MVP must 아님. - **검증 규칙 단일 소스(PL-23)**: channel_specs.validation_rules(jsonb, scope 필수) ↔ results.validation_result(jsonb) key 대응.\n  스칼라 규격 컬럼·image_count 폐지(→ module_spec).\n- **편집 데이터 3층(v2.0)**: crops(조각 캐시, ocr_cache) / placements(배치) / text_blocks(placement_id·module_id 분리, source_lines).\n  배경유형 판정 폐지(v2.4 단일 인페인팅 경로). 인페인팅 결과 배지 inpaint_badge(success/quality_warning/failed).\n- **브랜드 스냅샷(F-BRD-07)**: 작업 생성 시 projects.brand_snapshot(jsonb)에 브랜드 값 고정 → 번역 톤은 스냅샷 사용. - **내부 적재(소급 불가)**: audit_logs(A-ACC-03)·edit_signals(A-QA-01)·이벤트(NFR-29)는 write-point에서 서버 내부 발화. - **프론트 전용 · 무-API**: F-CFM-03(실행 취소 Undo)은 세션 내 클라이언트 상태(NFR-09).\n"}, "servers": [{"url": "https://api.pixate.example/v1", "description": "MVP (예시)"}], "tags": [{"name": "Auth", "description": "인증 (G1)"}, {"name": "Master", "description": "마스터 데이터 조회 — 시드 주입(PL-16), 읽기 전용"}, {"name": "Job", "description": "작업 생성·조회·단계 처리 (S1~S8)"}, {"name": "Block", "description": "텍스트 블록 편집 (S5·S7)"}, {"name": "Async", "description": "비동기 작업 상태 조회 (S4·S6·S8 공통)"}, {"name": "Library", "description": "보관함 (M1)"}, {"name": "Brand", "description": "브랜드 정보 (M2)"}], "paths": {"/auth/login": {"post": {" array", "items": {"$ref": "#/components/schemas/RegulatoryClass"}}}}}}}}, "/jobs": {"post": {"tags": ["Job"], "summary": "작업 생성", "description": "규격·카테고리·키워드로 작업 생성(F-SRC-10). 상태 `created`(생성됨). 국가·언어·규제분류는 S5에서 받는다. 생성 시점에 브랜드 값을 `brand_snapshot`(jsonb)으로 고정한다(F-BRD-07 · 이후 브랜드 수정은 미반영).\n", "operationId": "createJob", "x-screen": "S1", "x-feature-ids": ["F-SRC-04", "F-SRC-06", "F-SRC-10"], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["brand_id", "channel_spec_id", "category_id"], "properties": {"brand_id": {"type": "string", "format": "uuid"}, "channel_spec_id": {"type": "string", "format": "uuid"}, "category_id": {"type": "string", "format": "uuid", "description": "표시 카테고리(리프). 서버가 내부 7종 환산"}, "keywords": {"type": "array", "items": {"type": "string"}}}}}}}, "responses": {"201": {"description": "작업 생성됨", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Job"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}}}}, "/jobs/{id}": {"get": {"tags": ["Job"], "summary": "작업 상태·현재 단계 조회", "description": "프로세스 바(F-NAV-01) 및 화면 진입용. ERD `status`(6종) + `current_step`(S1~S8) 2축을 반환하며, `display_status`는 두 축의 조합으로 계산된 사용자용 9종 상태(v1.9 통일).\n", "operationId": "getJob", "x-screen": "S0", "x-feature-ids": ["F-NAV-01"], "parameters": [{"$ref": "#/components/parameters/JobId"}], "responses": {"200": {"description": "작업 상세", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Job"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/jobs/{id}/cancel": {"post": {"tags": ["Job"], "summary": "작업 취소", "description": "**v2.5 신설(F-JOB-07).** 작업을 취소하고 상태 `cancelled`로 전환. 처리 중(S4·S6)이면 진행 중 비동기 작업을 중단한다. 삭제 대상 열거 확인 다이얼로그는 프론트, 실제 취소는 이 API. \"처리만 멈추고 화면 체류\" 상태는 없다.\n", "operationId": "cancelJob", "x-screen": "전역", "x-feature-ids": ["F-JOB-07"], "parameters": [{"$ref": "#/components/parameters/JobId"}], "responses": {"200": {"description": "취소됨", "content": {"applicati
